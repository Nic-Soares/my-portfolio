<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-title" content="Portfólio Nicolas" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="/fonts/roboto/roboto-latin-wght.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <title>Portfolio Nicolas</title>
  </head>
  <body id="root" data-theme="Light">
    <!-- Apply the saved or system theme before first paint. Mirrors src/app/theme/theme.ts. -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.body.dataset.theme = theme === "dark" ? "Dark" : "Light";
      })();
      // <html lang> before first paint. Mirrors src/i18n/locale.ts.
      (function () {
        var tags = { en: "en", pt: "pt-BR", es: "es" };
        var locale = null;
        try {
          locale = localStorage.getItem("locale");
        } catch (e) {}
        if (!tags[locale]) {
          var languages = navigator.languages || [navigator.language];
          for (var i = 0; i < languages.length && !tags[locale]; i++) {
            locale = String(languages[i] || "").toLowerCase().split("-")[0];
          }
        }
        document.documentElement.lang = tags[locale] || "en";
      })();
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
